# Copy this into your ComfyUI root as `extra_model_paths.yaml` so ComfyUI reads
# the weights from this repo's models/ folder instead of its own.
# Edit base_path to the absolute path of this repo's models/ directory.
qwen_image_gguf:
    base_path: C:/cc/AI-Visual-Workshop/models
    diffusion_models: diffusion_models
    unet: diffusion_models
    text_encoders: text_encoders
    clip: text_encoders
    vae: vae
    loras: loras
    checkpoints: checkpoints        # SDPose (Pose tab)
    upscale_models: upscale_models  # 4x-UltraSharp V2 (Upscale)
    background_removal: background_removal  # BiRefNet (Background, Video FX)
    frame_interpolation: frame_interpolation  # RIFE (smooth video)

# Optional: Krea 2 Turbo (text-to-image only). Point base_path at wherever you keep
# its files, laid out as diffusion_models/ text_encoders/ vae/ loras/.
krea2:
    base_path: F:/AIModels/krea2
    diffusion_models: diffusion_models
    unet: diffusion_models
    text_encoders: text_encoders
    clip: text_encoders
    vae: vae
    loras: loras

# Optional: Wan 2.2 TI2V-5B (the Video tab). Same layout.
wan22:
    base_path: F:/AIModels/wan22
    diffusion_models: diffusion_models
    unet: diffusion_models
    text_encoders: text_encoders
    clip: text_encoders
    vae: vae
    loras: loras
